name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        php: ["8.5"]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, sqlite3, pdo_sqlite
          coverage: none

      - name: Prepare application
        run: |
          cp .env.example .env
          mkdir -p database bootstrap/cache storage/framework/cache storage/framework/sessions storage/framework/views
          touch database/database.sqlite

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Generate application key
        run: php artisan key:generate

      - name: Run Laravel tests
        run: vendor/bin/phpunit

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install npm dependencies
        run: npm install

      - name: Build assets
        run: npm run build

      - name: Package release
        run: |
          tar --exclude=.git --exclude=node_modules --exclude=vendor --exclude=.env --exclude=database/database.sqlite --exclude=release.tar.gz -czf /tmp/release.tar.gz .
          mv /tmp/release.tar.gz release.tar.gz

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: laravel-release-${{ github.sha }}
          path: release.tar.gz
          if-no-files-found: error
          retention-days: 3

  deploy:
    name: Deploy to Ubuntu VPS
    runs-on: ubuntu-latest
    needs: [test, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: production
      cancel-in-progress: false

    steps:
      - name: Download release artifact
        uses: actions/download-artifact@v5
        with:
          name: laravel-release-${{ github.sha }}

      - name: Upload release to VPS
        uses: appleboy/scp-action@v1
        with:
          host: ${{ vars.VPS_HOST }}
          username: ${{ vars.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          source: release.tar.gz
          target: /tmp
          timeout: 30s
          command_timeout: 10m

      - name: Bootstrap and deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.VPS_HOST }}
          username: ${{ vars.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          timeout: 30s
          command_timeout: 20m
          script: |
            set -e
            export DEBIAN_FRONTEND=noninteractive
            APP_DIR="/var/www/test"

            # Laravel 13 requires PHP 8.3+. Keep CI and production aligned on PHP 8.5.
            if ! command -v php8.5 >/dev/null 2>&1; then
              apt-get update
              apt-get install -y software-properties-common ca-certificates lsb-release apt-transport-https
              add-apt-repository ppa:ondrej/php -y
              apt-get update
            fi

            apt-get install -y nginx php8.5-cli php8.5-fpm php8.5-mbstring php8.5-xml php8.5-curl php8.5-sqlite3 php8.5-zip php8.5-bcmath php8.5-intl unzip git curl

            # Install Composer if it is not already available.
            if ! command -v composer >/dev/null 2>&1; then
              php -r "copy('https://getcomposer.org/installer', 'composer-setup.php');"
              php composer-setup.php --install-dir=/usr/local/bin --filename=composer
              rm -f composer-setup.php
            fi

            # Install Node.js 22 if it is missing or an older major is installed.
            NODE_MAJOR="$(node -p "process.versions.node.split('.')[0]" 2>/dev/null || echo 0)"
            if [ "$NODE_MAJOR" -lt 22 ]; then
              curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
              apt-get install -y nodejs
            fi

            mkdir -p "$APP_DIR"
            tar -xzf /tmp/release.tar.gz -C "$APP_DIR"
            rm -f /tmp/release.tar.gz
            cd "$APP_DIR"

            # Create production environment on the first deployment only.
            if [ ! -f .env ]; then
              cp .env.example .env
              sed -i 's/^APP_ENV=.*/APP_ENV=production/' .env
              sed -i 's/^APP_DEBUG=.*/APP_DEBUG=false/' .env
              sed -i 's#^APP_URL=.*#APP_URL=http://${{ vars.VPS_HOST }}#' .env
              sed -i 's/^CACHE_STORE=.*/CACHE_STORE=file/' .env
              sed -i 's/^SESSION_DRIVER=.*/SESSION_DRIVER=file/' .env
              sed -i 's#^DB_DATABASE=.*#DB_DATABASE=/var/www/test/database/database.sqlite#' .env
            fi

            mkdir -p database
            touch database/database.sqlite
            mkdir -p bootstrap/cache storage/framework/cache storage/framework/sessions storage/framework/views

            composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

            if ! grep -q '^APP_KEY=base64:' .env; then
              php artisan key:generate --force
            fi
            php artisan migrate --force
            php artisan optimize
            php artisan storage:link || true

            # Configure Nginx to serve only Laravel public/.
            cat > /etc/nginx/sites-available/test <<'NGINX'
            server {
                listen 80 default_server;
                listen [::]:80 default_server;
                server_name ${{ vars.VPS_HOST }} _;
                root /var/www/test/public;
                index index.php;
                charset utf-8;
                add_header X-Frame-Options "SAMEORIGIN";
                add_header X-Content-Type-Options "nosniff";

                location / {
                    try_files $uri $uri/ /index.php?$query_string;
                }

                location = /favicon.ico { access_log off; log_not_found off; }
                location = /robots.txt  { access_log off; log_not_found off; }
                error_page 404 /index.php;

                location ~ ^/index\.php(/|$) {
                    fastcgi_pass unix:/var/run/php/php8.5-fpm.sock;
                    fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
                    include fastcgi_params;
                    fastcgi_hide_header X-Powered-By;
                }

                location ~ /\.(?!well-known).* {
                    deny all;
                }
            }
            NGINX
            ln -sf /etc/nginx/sites-available/test /etc/nginx/sites-enabled/test
            rm -f /etc/nginx/sites-enabled/default

            chown -R www-data:www-data storage bootstrap/cache
            chmod -R ug+rwX storage bootstrap/cache
            nginx -t
            systemctl enable nginx php8.5-fpm
            systemctl reload php8.5-fpm || systemctl restart php8.5-fpm
            systemctl reload nginx || systemctl restart nginx
            php artisan queue:restart || true

            echo "Deployment completed successfully"

      - name: Health check
        run: |
          for i in 1 2 3 4 5; do
            if curl --fail --silent --show-error --max-time 10 http://${{ vars.VPS_HOST }}/up > /dev/null; then
              echo "Health check passed"
              exit 0
            fi
            sleep 5
          done
          echo "Health check failed: http://${{ vars.VPS_HOST }}/up"
          exit 1

  notify:
    name: Telegram notification
    runs-on: ubuntu-latest
    needs: [deploy]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Send Telegram notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DEPLOY_STATUS: ${{ needs.deploy.result }}
          PROJECT_NAME: ${{ github.event.repository.name }}
        run: |
          set -e
          case "$DEPLOY_STATUS" in
            success)
              ACTION="Deploy completed"
              ;;
            failure)
              ACTION="Deploy failed"
              ;;
            skipped)
              ACTION="Deploy skipped"
              ;;
            *)
              ACTION="Deploy status: $DEPLOY_STATUS"
              ;;
          esac

          curl --fail --silent --show-error -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=GitHub - ${PROJECT_NAME} - ${ACTION}"
