name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Only the newest commit for a branch is allowed to run.
  # This also cancels an active deployment of an older commit.
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        php: ["8.5"]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, sqlite3, pdo_sqlite
          coverage: none

      - name: Prepare application
        run: |
          cp .env.example .env
          mkdir -p database bootstrap/cache storage/framework/cache storage/framework/sessions storage/framework/views
          touch database/database.sqlite

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Generate application key
        run: php artisan key:generate

      - name: Run Laravel tests
        run: vendor/bin/phpunit

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install npm dependencies
        run: npm install

      - name: Build assets
        run: npm run build

      - name: Package release
        run: |
          tar --exclude=.git --exclude=node_modules --exclude=vendor --exclude=.env --exclude=database/database.sqlite --exclude=release.tar.gz -czf /tmp/release.tar.gz .
          mv /tmp/release.tar.gz release.tar.gz

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: laravel-release-${{ github.sha }}
          path: release.tar.gz
          if-no-files-found: error
          retention-days: 3

  deploy:
    name: Deploy to Ubuntu VPS
    runs-on: ubuntu-latest
    needs: [test, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Download release artifact
        uses: actions/download-artifact@v5
        with:
          name: laravel-release-${{ github.sha }}

      - name: Update DuckDNS record
        env:
          DUCKDNS_TOKEN: ${{ secrets.DUCKDNS_TOKEN }}
        run: |
          set -e
          test -n "$DUCKDNS_TOKEN"
          response="$(curl --fail --silent --show-error --retry 3             "https://www.duckdns.org/update?domains=project-0&token=${DUCKDNS_TOKEN}&ip=45.137.42.239")"
          test "$response" = "OK"
          echo "DuckDNS record updated"

      - name: Upload release to VPS
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USERNAME: ${{ vars.VPS_USERNAME }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          base64 -w 0 release.tar.gz | sshpass -p "$VPS_PASSWORD" ssh             -o StrictHostKeyChecking=no             -o UserKnownHostsFile=/dev/null             -o ConnectTimeout=30             -o ServerAliveInterval=10             -o ServerAliveCountMax=3             "$VPS_USERNAME@$VPS_HOST"             'base64 -d > /tmp/release.tar.gz'
          echo "Release uploaded successfully"

      - name: Bootstrap and deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.VPS_HOST }}
          username: ${{ vars.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          timeout: 30s
          command_timeout: 20m
          script: |
            set -e
            export DEBIAN_FRONTEND=noninteractive
            APP_DIR="/var/www/project-0"

            if [ -d /var/www/stools ] && [ ! -d "$APP_DIR" ]; then
              mv /var/www/stools "$APP_DIR"
            elif [ -d /var/www/test ] && [ ! -d "$APP_DIR" ]; then
              mv /var/www/test "$APP_DIR"
            fi

            if ! command -v php8.5 >/dev/null 2>&1; then
              apt-get update
              apt-get install -y software-properties-common ca-certificates lsb-release apt-transport-https
              add-apt-repository ppa:ondrej/php -y
              apt-get update
            fi

            apt-get install -y nginx php8.5-cli php8.5-fpm php8.5-mbstring php8.5-xml php8.5-curl php8.5-sqlite3 php8.5-zip php8.5-bcmath php8.5-intl unzip git curl

            if ! command -v composer >/dev/null 2>&1; then
              php -r "copy('https://getcomposer.org/installer', 'composer-setup.php');"
              php composer-setup.php --install-dir=/usr/local/bin --filename=composer
              rm -f composer-setup.php
            fi

            NODE_MAJOR="$(node -p "process.versions.node.split('.')[0]" 2>/dev/null || echo 0)"
            if [ "$NODE_MAJOR" -lt 22 ]; then
              curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
              apt-get install -y nodejs
            fi

            mkdir -p "$APP_DIR"
            tar -xzf /tmp/release.tar.gz -C "$APP_DIR"
            rm -f /tmp/release.tar.gz
            cd "$APP_DIR"

            if [ ! -f .env ]; then
              cp .env.example .env
              sed -i 's/^APP_ENV=.*/APP_ENV=production/' .env
              sed -i 's/^APP_DEBUG=.*/APP_DEBUG=false/' .env
              sed -i 's#^APP_URL=.*#APP_URL=https://project-0.duckdns.org#' .env
              sed -i 's/^CACHE_STORE=.*/CACHE_STORE=file/' .env
              sed -i 's/^SESSION_DRIVER=.*/SESSION_DRIVER=file/' .env
              sed -i 's#^DB_DATABASE=.*#DB_DATABASE=/var/www/project-0/database/database.sqlite#' .env
            fi

            mkdir -p database
            touch database/database.sqlite
            mkdir -p bootstrap/cache storage/framework/cache storage/framework/sessions storage/framework/views

            if [ -f composer.lock ] && composer check-platform-reqs --no-interaction >/dev/null 2>&1 && composer validate --no-check-publish --no-interaction >/dev/null 2>&1; then
              composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
            else
              rm -f composer.lock
              composer update --no-dev --no-interaction --prefer-dist --optimize-autoloader
            fi

            if [ -n "${{ secrets.VAPID_SUBJECT }}" ]; then sed -i "s#^VAPID_SUBJECT=.*#VAPID_SUBJECT=${{ secrets.VAPID_SUBJECT }}#" .env; fi
            if [ -n "${{ secrets.VAPID_PUBLIC_KEY }}" ]; then sed -i "s#^VAPID_PUBLIC_KEY=.*#VAPID_PUBLIC_KEY=${{ secrets.VAPID_PUBLIC_KEY }}#" .env; fi
            if [ -n "${{ secrets.VAPID_PRIVATE_KEY }}" ]; then sed -i "s#^VAPID_PRIVATE_KEY=.*#VAPID_PRIVATE_KEY=${{ secrets.VAPID_PRIVATE_KEY }}#" .env; fi

            if ! grep -Eq '^VAPID_PUBLIC_KEY=.+$' .env || ! grep -Eq '^VAPID_PRIVATE_KEY=.+$' .env; then
              php -r '
              require "vendor/autoload.php";
              $path = ".env";
              $keys = \Minishlink\WebPush\VAPID::createVapidKeys();
              $env = file_get_contents($path);
              if ($env === false) {
                  throw new RuntimeException("Unable to read .env");
              }
              foreach ([
                  "VAPID_PUBLIC_KEY" => $keys["publicKey"],
                  "VAPID_PRIVATE_KEY" => $keys["privateKey"],
              ] as $name => $value) {
                  $pattern = "/^" . preg_quote($name, "/") . "=.*$/m";
                  $replacement = $name . "=" . $value;
                  $updated = preg_replace($pattern, $replacement, $env, 1, $count);
                  if ($count === 0) {
                      $updated = rtrim($updated) . PHP_EOL . $replacement . PHP_EOL;
                  }
                  $env = $updated;
              }
              if (file_put_contents($path, $env) === false) {
                  throw new RuntimeException("Unable to write .env");
              }
              '
              echo "VAPID keys generated on VPS"
            fi

            # Ensure Laravel does not keep stale VAPID values in its config cache.
            php artisan config:clear

            if ! grep -q '^APP_KEY=base64:' .env; then
              php artisan key:generate --force
            fi
            php artisan migrate --seed --force

            chown www-data:www-data database/database.sqlite
            chmod 664 database/database.sqlite

            php artisan optimize
            php artisan storage:link || true
            sed -i 's#^APP_URL=.*#APP_URL=https://project-0.duckdns.org#' .env

            cat > /etc/nginx/sites-available/stools <<'NGINX'
            server {
                listen 80 default_server;
                listen [::]:80 default_server;
                server_name project-0.duckdns.org ${{ vars.VPS_HOST }};
                root /var/www/project-0/public;
                index index.php;
                charset utf-8;
                add_header X-Frame-Options "SAMEORIGIN";
                add_header X-Content-Type-Options "nosniff";

                location / {
                    try_files $uri $uri/ /index.php?$query_string;
                }

                location = /favicon.ico { access_log off; log_not_found off; }
                location = /robots.txt  { access_log off; log_not_found off; }
                error_page 404 /index.php;

                location ~ ^/index\.php(/|$) {
                    fastcgi_pass unix:/var/run/php/php8.5-fpm.sock;
                    fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
                    include fastcgi_params;
                    fastcgi_hide_header X-Powered-By;
                }

                location ~ /\.(?!well-known).* {
                    deny all;
                }
            }
            NGINX
            ln -sf /etc/nginx/sites-available/stools /etc/nginx/sites-enabled/stools
            rm -f /etc/nginx/sites-enabled/default /etc/nginx/sites-enabled/test

            chown -R www-data:www-data storage bootstrap/cache
            chmod -R ug+rwX storage bootstrap/cache
            nginx -t
            systemctl enable nginx php8.5-fpm

            apt-get install -y certbot python3-certbot-nginx
            if [ ! -f /etc/letsencrypt/live/project-0.duckdns.org/fullchain.pem ]; then
              certbot --nginx -d project-0.duckdns.org --non-interactive --agree-tos --register-unsafely-without-email --redirect
            else
              certbot renew --quiet
              certbot install --cert-name project-0.duckdns.org --nginx --redirect
            fi

            if command -v ufw >/dev/null 2>&1; then
              # Keep SSH reachable before enabling/reloading the firewall.
              ufw allow 22/tcp
              ufw allow 80/tcp
              ufw allow 443/tcp
              ufw --force enable || true
            fi

            systemctl enable certbot.timer >/dev/null 2>&1 || true
            systemctl start certbot.timer >/dev/null 2>&1 || true
            systemctl reload php8.5-fpm || systemctl restart php8.5-fpm
            systemctl reload nginx || systemctl restart nginx

            echo "=== HTTPS diagnostics on VPS ==="
            ss -ltnp | grep -E ':(80|443)\s' || true
            nginx -T 2>/dev/null | grep -E 'listen .*443|server_name .*project-0\.duckdns\.org' || true
            curl --fail --silent --show-error --max-time 15 --resolve project-0.duckdns.org:443:127.0.0.1 https://project-0.duckdns.org/up >/dev/null
            echo "Local HTTPS health check passed"
            curl --fail --silent --show-error --max-time 15 --resolve project-0.duckdns.org:443:127.0.0.1 https://project-0.duckdns.org/push/config | php -r '
              $data = json_decode(stream_get_contents(STDIN), true);
              if (($data["enabled"] ?? false) !== true) {
                  fwrite(STDERR, "VAPID configuration is not enabled after deployment\n");
                  exit(1);
              }
            '
            echo "VAPID configuration health check passed"
            echo "=== End HTTPS diagnostics ==="

            php artisan queue:restart || true
            echo "Deployment completed successfully"

      - name: Health check
        run: |
          for i in 1 2 3 4 5; do
            if curl --fail --silent --show-error --max-time 15 https://project-0.duckdns.org/up > /dev/null; then
              echo "Health check passed"
              exit 0
            fi
            sleep 5
          done
          echo "Health check failed: https://project-0.duckdns.org/up"
          exit 1

      - name: Notify admin about successful deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.VPS_HOST }}
          username: ${{ vars.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          timeout: 30s
          command_timeout: 5m
          script: |
            set -e
            cd /var/www/project-0
            php artisan push:deploy-success

  notify:
    name: Telegram notification
    runs-on: ubuntu-latest
    needs: [test, frontend, deploy]
    if: ${{ failure() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}

    steps:
      - name: Send Telegram notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PROJECT_NAME: project-0
        run: |
          set -e
          curl --fail --silent --show-error -X POST             "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"             --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}"             --data-urlencode "text=GitHub - ${PROJECT_NAME} - Deploy failed"
