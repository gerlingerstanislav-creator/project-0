name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        php: ["8.3", "8.4"]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, sqlite3, pdo_sqlite
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare application
        run: |
          cp .env.example .env
          mkdir -p database
          touch database/database.sqlite
          php artisan key:generate

      - name: Run Laravel tests
        run: php artisan test

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install npm dependencies
        run: npm install

      - name: Build assets
        run: npm run build

      - name: Package release
        run: tar --exclude=.git --exclude=node_modules --exclude=vendor --exclude=.env --exclude=database/database.sqlite -czf release.tar.gz .

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: laravel-release-${{ github.sha }}
          path: release.tar.gz
          if-no-files-found: error
          retention-days: 3

  deploy:
    name: Deploy to Ubuntu VPS
    runs-on: ubuntu-latest
    needs: [test, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
    concurrency:
      group: production
      cancel-in-progress: false

    steps:
      - name: Download release artifact
        uses: actions/download-artifact@v5
        with:
          name: laravel-release-${{ github.sha }}

      - name: Upload release to VPS
        uses: appleboy/scp-action@v1.0.0
        with:
          host: 45.137.42.239
          username: root
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          source: release.tar.gz
          target: /tmp
          timeout: 30s
          command_timeout: 10m

      - name: Deploy release
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: 45.137.42.239
          username: root
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          timeout: 30s
          command_timeout: 10m
          script: |
            set -e
            APP_DIR="/var/www/test"
            mkdir -p "$APP_DIR"
            test -f "$APP_DIR/.env" || { echo "ERROR: $APP_DIR/.env is missing on the VPS"; exit 1; }
            tar -xzf /tmp/release.tar.gz -C "$APP_DIR"
            rm -f /tmp/release.tar.gz
            cd "$APP_DIR"
            composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
            php artisan migrate --force
            php artisan optimize
            php artisan storage:link || true
            if command -v systemctl >/dev/null 2>&1; then
              systemctl reload php8.3-fpm 2>/dev/null || true
            fi
            if [ -f artisan ]; then
              php artisan queue:restart || true
            fi
            echo "Deployment completed: $(git rev-parse --short HEAD 2>/dev/null || echo "${GITHUB_SHA:-release}")"

      - name: Health check
        run: |
          for i in 1 2 3 4 5; do
            if curl --fail --silent --show-error --max-time 10 http://45.137.42.239/up > /dev/null; then
              echo "Health check passed"
              exit 0
            fi
            sleep 5
          done
          echo "Health check failed: http://45.137.42.239/up"
          exit 1
