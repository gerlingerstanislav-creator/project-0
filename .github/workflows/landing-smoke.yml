name: Public landing browser smoke

on:
  workflow_run:
    workflows: ["Deploy"]
    branches: ["main"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-landing-browser-smoke
  cancel-in-progress: true

jobs:
  smoke:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright for browser checks
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Check public landing in Chromium
        run: node scripts/smoke-landing.mjs
        env:
          SITE_URL: https://project-0.duckdns.org/put-bez-pregrad

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-landing-screenshots
          path: output/landing-smoke/
          if-no-files-found: ignore
          retention-days: 5
