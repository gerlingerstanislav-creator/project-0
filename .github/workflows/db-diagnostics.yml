name: Database diagnostics

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: ["main"]

permissions:
  contents: read

jobs:
  diagnostics:
    name: Read-only production database diagnostics
    runs-on: ubuntu-latest
    steps:
      - name: Run diagnostics on production
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.VPS_HOST }}
          username: ${{ vars.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          timeout: 30s
          command_timeout: 5m
          script: |
            set -e
            cd /var/www/project-0
            php artisan project:db-diagnostics --json
