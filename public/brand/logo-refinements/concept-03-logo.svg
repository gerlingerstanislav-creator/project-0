<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 790 172" role="img" aria-labelledby="t d"><title id="t">Под защитой — логотип Путь без преград</title><desc id="d">Сопровождающий и колясочник внутри плотного символа-объятия. Кольцо короче и заметнее, что делает знак устойчивым на вывеске.</desc><g transform="translate(0 3) scale(1)"><path d="M35 127C11 97 17 58 43 37C70 13 113 17 136 44" fill="none" stroke="#142C40" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/><path d="M140 61C153 92 134 122 112 135" fill="none" stroke="#0CA6A1" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/><path d="M25 138C52 151 85 150 102 145" fill="none" stroke="#E42F4D" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><circle cx="55" cy="62" r="10" fill="#142C40"/><path d="M53 78L48 108L40 120" fill="none" stroke="#142C40" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/><path d="M57 81L76 88" fill="none" stroke="#142C40" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="96" cy="65" r="9" fill="#142C40"/><path d="M96 81V97H116" fill="none" stroke="#142C40" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><circle cx="94" cy="113" r="18" fill="none" stroke="#142C40" stroke-width="9"/><path d="M116 97L127 116H138" fill="none" stroke="#142C40" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></g><g font-family="Arial,Helvetica,sans-serif" font-weight="800"><text x="190" y="72" font-size="61" letter-spacing="-1.8" fill="#142C40">Путь</text><text x="190" y="131" font-size="58" letter-spacing="-1.5"><tspan fill="#E42F4D">без </tspan><tspan fill="#142C40">преград</tspan></text></g><text x="193" y="160" fill="#142C40" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" letter-spacing="3.2">ДОСТУПНЫЕ ПЕРЕВОЗКИ</text></svg>
