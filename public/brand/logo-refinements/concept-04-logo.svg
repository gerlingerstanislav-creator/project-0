<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 790 172" role="img" aria-labelledby="t d"><title id="t">Открытый проём — логотип Путь без преград</title><desc id="d">Проём раздвижной двери вместо полного автомобиля. Рампа соединяет знак с дорогой, а человек на коляске остаётся главным.</desc><g transform="translate(0 3) scale(1)"><path d="M29 125V42Q29 25 46 25H117Q133 25 133 41V120" fill="none" stroke="#142C40" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/><path d="M118 40V91" fill="none" stroke="#0CA6A1" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><circle cx="83" cy="55" r="10" fill="#142C40"/><path d="M83 72V89H105" fill="none" stroke="#142C40" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><circle cx="83" cy="110" r="19" fill="none" stroke="#142C40" stroke-width="9"/><path d="M105 89L116 112H129" fill="none" stroke="#142C40" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M23 139H93Q114 139 130 123" fill="none" stroke="#E42F4D" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/></g><g font-family="Arial,Helvetica,sans-serif" font-weight="800"><text x="190" y="72" font-size="61" letter-spacing="-1.8" fill="#142C40">Путь</text><text x="190" y="131" font-size="58" letter-spacing="-1.5"><tspan fill="#E42F4D">без </tspan><tspan fill="#142C40">преград</tspan></text></g><text x="193" y="160" fill="#142C40" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" letter-spacing="3.2">ДОСТУПНЫЕ ПЕРЕВОЗКИ</text></svg>
