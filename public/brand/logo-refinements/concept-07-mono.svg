<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 790 172" role="img" aria-labelledby="t d"><title id="t">Открытый круг — логотип Путь без преград</title><desc id="d">Упрощение выбранного четвёртого логотипа: одна большая бирюзовая дуга, красный сегмент движения и чёткий пассажир.</desc><g transform="translate(0 3) scale(1)"><path d="M32 115C18 81 29 46 58 28C91 8 126 30 139 57" fill="none" stroke="#142C40" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/><path d="M142 76C150 109 127 134 103 141" fill="none" stroke="#142C40" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><circle cx="83" cy="55" r="11" fill="#142C40"/><path d="M83 74V94H107" fill="none" stroke="#142C40" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><circle cx="83" cy="113" r="21" fill="none" stroke="#142C40" stroke-width="9"/><path d="M107 95L121 117H136" fill="none" stroke="#142C40" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></g><g font-family="Arial,Helvetica,sans-serif" font-weight="800"><text x="190" y="72" font-size="61" letter-spacing="-1.8" fill="#142C40">Путь</text><text x="190" y="131" font-size="58" letter-spacing="-1.5"><tspan fill="#142C40">без </tspan><tspan fill="#142C40">преград</tspan></text></g><text x="193" y="160" fill="#142C40" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" letter-spacing="3.2">ДОСТУПНЫЕ ПЕРЕВОЗКИ</text></svg>
