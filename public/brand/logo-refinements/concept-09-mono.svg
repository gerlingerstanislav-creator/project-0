<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 790 172" role="img" aria-labelledby="t d"><title id="t">Точка назначения — логотип Путь без преград</title><desc id="d">Внешняя форма напоминает отметку маршрута на карте. Внутри — лаконичный пассажир. Для сервиса перевозок это сочетание человека и точки назначения.</desc><g transform="translate(0 3) scale(1)"><path d="M39 110C26 89 26 65 40 46C60 18 103 17 126 39C153 67 140 103 111 125L84 148L62 131" fill="none" stroke="#142C40" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><path d="M37 110L61 131" fill="none" stroke="#142C40" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/><circle cx="83" cy="55" r="9" fill="#142C40"/><path d="M83 71V90H105" fill="none" stroke="#142C40" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><circle cx="83" cy="108" r="18" fill="none" stroke="#142C40" stroke-width="9"/><path d="M105 90L119 111H129" fill="none" stroke="#142C40" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></g><g font-family="Arial,Helvetica,sans-serif" font-weight="800"><text x="190" y="72" font-size="61" letter-spacing="-1.8" fill="#142C40">Путь</text><text x="190" y="131" font-size="58" letter-spacing="-1.5"><tspan fill="#142C40">без </tspan><tspan fill="#142C40">преград</tspan></text></g><text x="193" y="160" fill="#142C40" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" letter-spacing="3.2">ДОСТУПНЫЕ ПЕРЕВОЗКИ</text></svg>
