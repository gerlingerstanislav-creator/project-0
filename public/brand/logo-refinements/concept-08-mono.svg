<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 790 172" role="img" aria-labelledby="t d"><title id="t">Лента маршрута — логотип Путь без преград</title><desc id="d">Подчёркнутая траектория дороги вытягивает знак вперёд. Открытая окружность сохраняет смысл доступности, а не просто скорости.</desc><g transform="translate(0 3) scale(1)"><path d="M25 100C14 64 39 30 74 23C108 18 139 43 142 77" fill="none" stroke="#142C40" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><path d="M20 137C51 129 73 138 105 138C125 138 137 123 141 112" fill="none" stroke="#142C40" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><path d="M24 152C64 147 112 151 145 137" fill="none" stroke="#142C40" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="85" cy="58" r="10" fill="#142C40"/><path d="M84 76V93H107" fill="none" stroke="#142C40" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><circle cx="84" cy="111" r="19" fill="none" stroke="#142C40" stroke-width="9"/><path d="M106 93L119 113H134" fill="none" stroke="#142C40" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></g><g font-family="Arial,Helvetica,sans-serif" font-weight="800"><text x="190" y="72" font-size="61" letter-spacing="-1.8" fill="#142C40">Путь</text><text x="190" y="131" font-size="58" letter-spacing="-1.5"><tspan fill="#142C40">без </tspan><tspan fill="#142C40">преград</tspan></text></g><text x="193" y="160" fill="#142C40" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" letter-spacing="3.2">ДОСТУПНЫЕ ПЕРЕВОЗКИ</text></svg>
