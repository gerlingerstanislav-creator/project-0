<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-labelledby="t d"><title id="t">Рампа к свободе — знак Путь без преград</title><desc id="d">Два вертикальных штриха напоминают открытую дверь, диагональ — пандус. Машина считывается через посадку, а не через кузов и колёса.</desc><path d="M34 116V35Q34 26 44 26H120" fill="none" stroke="#142C40" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><path d="M123 35V108" fill="none" stroke="#0CA6A1" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><path d="M26 141L93 141L137 114" fill="none" stroke="#E42F4D" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/><circle cx="76" cy="56" r="10" fill="#142C40"/><path d="M76 73V91H98" fill="none" stroke="#142C40" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><circle cx="78" cy="114" r="20" fill="none" stroke="#142C40" stroke-width="9"/><path d="M98 92L110 113H123" fill="none" stroke="#142C40" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></svg>
