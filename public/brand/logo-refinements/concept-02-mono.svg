<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 790 172" role="img" aria-labelledby="t d"><title id="t">Плечом к плечу — логотип Путь без преград</title><desc id="d">Два силуэта объединяет одна линия: рука сопровождающего поддерживает пассажира. Круг используется как спокойная защитная арка.</desc><g transform="translate(0 3) scale(1)"><path d="M31 116C18 73 36 36 82 24C113 19 139 43 142 74" fill="none" stroke="#142C40" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/><path d="M26 132C61 145 103 146 138 128" fill="none" stroke="#142C40" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/><circle cx="52" cy="52" r="10" fill="#142C40"/><path d="M48 67C44 79 44 94 42 107L32 126" fill="none" stroke="#142C40" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><path d="M55 69L72 84L83 80" fill="none" stroke="#142C40" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><circle cx="94" cy="62" r="9" fill="#142C40"/><path d="M94 78V94H115" fill="none" stroke="#142C40" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><circle cx="93" cy="113" r="19" fill="none" stroke="#142C40" stroke-width="9"/><path d="M115 94L128 115H137" fill="none" stroke="#142C40" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></g><g font-family="Arial,Helvetica,sans-serif" font-weight="800"><text x="190" y="72" font-size="61" letter-spacing="-1.8" fill="#142C40">Путь</text><text x="190" y="131" font-size="58" letter-spacing="-1.5"><tspan fill="#142C40">без </tspan><tspan fill="#142C40">преград</tspan></text></g><text x="193" y="160" fill="#142C40" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" letter-spacing="3.2">ДОСТУПНЫЕ ПЕРЕВОЗКИ</text></svg>
