<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 790 172" role="img" aria-labelledby="t d"><title id="t">Контур спецмашины — логотип Путь без преград</title><desc id="d">Контур крыши минивэна почти без деталей — лишь большой проём и инвалидная коляска. Не похож на автомобильный клипарт.</desc><g transform="translate(0 3) scale(1)"><path d="M22 124V67Q22 40 50 36H96Q118 36 131 59L143 79V121" fill="none" stroke="#142C40" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><path d="M113 51H119L132 77H113Z" fill="none" stroke="#142C40" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="77" cy="67" r="10" fill="#142C40"/><path d="M77 83V99H101" fill="none" stroke="#142C40" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><circle cx="78" cy="118" r="18" fill="none" stroke="#142C40" stroke-width="9"/><path d="M101 99L112 118H125" fill="none" stroke="#142C40" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M32 142H128" fill="none" stroke="#142C40" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></g><g font-family="Arial,Helvetica,sans-serif" font-weight="800"><text x="190" y="72" font-size="61" letter-spacing="-1.8" fill="#142C40">Путь</text><text x="190" y="131" font-size="58" letter-spacing="-1.5"><tspan fill="#142C40">без </tspan><tspan fill="#142C40">преград</tspan></text></g><text x="193" y="160" fill="#142C40" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" letter-spacing="3.2">ДОСТУПНЫЕ ПЕРЕВОЗКИ</text></svg>
