<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 170" role="img" aria-labelledby="title desc">
<title id="title">Логотип Путь без преград — Монограмма «П»</title>
<desc id="desc">Буква «П» выглядит как открытая дверь спецтранспорта. Внутри — человек на коляске, снизу — лёгкая линия пути. Легко создавать собственный узнаваемый стиль.</desc>

 <g transform="translate(14 17) scale(1.06)">
 <path d="M26 103V28H101V91" fill="none" stroke="#142B3F" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
 <circle cx="57" cy="51" r="8" fill="#DA304A"/>
 <path d="M58 64V79H80" fill="none" stroke="#142B3F" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
 <circle cx="57" cy="91" r="16" fill="none" stroke="#009C9A" stroke-width="8"/>
 <path d="M31 115Q64 115 98 103" fill="none" stroke="#DA304A" stroke-width="7" stroke-linecap="round"/></g>
 <g font-family="Arial, Helvetica, sans-serif" font-weight="800" letter-spacing="-1.2">
  <text x="175" y="66" fill="#142B3F" font-size="53">Путь</text>
  <text x="175" y="121" font-size="51"><tspan fill="#DA304A">без </tspan><tspan fill="#142B3F">преград</tspan></text>
 </g>
 <text x="178" y="150" fill="#142B3F" font-size="16" font-family="Arial, Helvetica, sans-serif" font-weight="700" letter-spacing="4">ДОСТУПНЫЕ ПЕРЕВОЗКИ</text>
</svg>
