<title id="title">Логотип Путь без преград — Путь</title>
<desc id="desc">Пассажир и две динамичные линии, напоминающие дорожную траекторию. Абстрактнее, чем первый вариант, лучше подходит небольшому значку и узнаваемому фирменному символу.</desc>

