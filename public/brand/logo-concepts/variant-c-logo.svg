<title id="title">Логотип Путь без преград — Минивэн</title>
<desc id="desc">Максимально упрощённый кузов с двумя колёсами и пиктограммой коляски внутри. Подходит, если заказчику важнее немедленная ассоциация с автомобилем.</desc>

